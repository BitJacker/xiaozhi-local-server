<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="acc.title">Il tuo account</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2228%22 fill=%22%231f3fb8%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2256%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22700%22%3EH%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/ui.css">
<script src="/static/strings.js"></script>
<script src="/static/ui.js"></script>
<style>
  .wrap { max-width:760px; }
  .wrap > h1 { margin-bottom:4px; }
  .sheet h2 { margin-bottom:10px; }
  .sheet + .sheet { margin-top:16px; }
  .qr { background:#fff; display:inline-block; padding:10px; border-radius:var(--r-sm); border:1px solid var(--line); margin:6px 0 10px; }
  .qr svg { display:block; width:200px; height:200px; }
  .fields { display:grid; gap:12px; max-width:420px; }
  .code-input { font-size:1.4rem; letter-spacing:.3em; max-width:220px; }
  .on { color:var(--green); font-weight:700; }
</style>
</head>
<body>
<header id="topbar"></header>
<main class="page wrap">
  <h1 data-i18n="acc.title"></h1>
  <p class="muted" id="who"></p>
  <p class="notice err hidden" id="must2fa" data-i18n="acc.must2fa"></p>
  <p class="notice err hidden" id="mustpwd" data-i18n="acc.mustpwd"></p>

  <section class="sheet pad" style="margin-top:18px">
    <h2 data-i18n="acc.2fa"></h2>
    <div id="tfa-off">
      <p data-i18n="acc.2fa_lead"></p>
      <button class="btn" id="tfa-start" data-i18n="acc.2fa_start"></button>
    </div>
    <div id="tfa-setup" class="hidden">
      <p data-i18n="acc.2fa_scan"></p>
      <div class="qr" id="qr"></div>
      <p><code id="secret"></code></p>
      <div class="fields">
        <div><label for="tfa-code" data-i18n="acc.2fa_code"></label>
          <input id="tfa-code" class="code-input" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
        <div><button class="btn" id="tfa-confirm" data-i18n="acc.2fa_confirm"></button></div>
      </div>
    </div>
    <div id="tfa-on" class="hidden">
      <p class="on" data-i18n="acc.2fa_on"></p>
      <div class="fields" id="tfa-off-form">
        <div><label for="tfa-pass" data-i18n="acc.2fa_pass"></label><input id="tfa-pass" type="password" autocomplete="current-password"></div>
        <div><button class="btn danger" id="tfa-disable" data-i18n="acc.2fa_disable"></button></div>
      </div>
    </div>
    <div class="msg" id="tfa-msg" role="alert"></div>
  </section>

  <section class="sheet pad hidden" id="mem-box">
    <h2 data-i18n="mem.title"></h2>
    <p class="muted" data-i18n="mem.lead"></p>
    <div class="table"><table><tbody id="mem-list"></tbody></table></div>
    <div style="margin-top:12px"><button class="btn danger" id="mem-clear" data-i18n="mem.clear"></button></div>
    <div class="msg" id="mem-msg" role="alert"></div>
  </section>

  <section class="sheet pad">
    <h2 data-i18n="acc.pwd"></h2>
    <div class="fields">
      <div><label for="p-old" data-i18n="acc.pwd_old"></label><input id="p-old" type="password" autocomplete="current-password"></div>
      <div><label for="p-new" data-i18n="acc.pwd_new"></label><input id="p-new" type="password" autocomplete="new-password"></div>
      <div><label for="p-new2" data-i18n="acc.pwd_new2"></label><input id="p-new2" type="password" autocomplete="new-password"></div>
      <div><button class="btn" id="p-save" data-i18n="acc.pwd_save"></button></div>
    </div>
    <div class="msg" id="p-msg" role="alert"></div>
  </section>
</main>
<script>
const { t, api, msg } = HUSKY;
const $ = (id) => document.getElementById(id);
const show = (id, on) => $(id).classList.toggle("hidden", !on);
let me = null;
HUSKY.topbar("/account");

function renderWho() {
  if (!me) return;
  $("who").textContent = me.auth_enabled
    ? `${me.username}, ${t(me.role === "admin" ? "acc.admin" : "acc.user")}. ` +
      t("acc.info", { created: me.created || "—", last: me.last_login || t("common.never") })
    : t("acc.disabled");
}
async function load() {
  me = (await api("/api/me")).data;
  renderWho();
  show("must2fa", me.must_setup_2fa && !me.must_change_password);
  show("mustpwd", me.must_change_password);
  if (me.must_change_password) { $("p-old").focus(); $("p-old").closest("section").scrollIntoView(); }
  show("tfa-off", !me.totp); show("tfa-on", !!me.totp); show("tfa-setup", false);
  show("tfa-off-form", !me.require_2fa);
  if (new URLSearchParams(location.search).get("setup2fa") && !me.totp && me.auth_enabled) $("tfa-start").focus();
}
$("tfa-start").onclick = async () => {
  const r = await api("/api/account/2fa-begin", "POST", {});
  if (r.data.error) return msg($("tfa-msg"), r.data.error);
  $("qr").innerHTML = r.data.qr;  // SVG generato dal nostro server
  $("secret").textContent = r.data.secret;
  show("tfa-off", false); show("tfa-setup", true); $("tfa-code").focus();
};
$("tfa-confirm").onclick = async () => {
  const r = await api("/api/account/2fa-confirm", "POST", { code: $("tfa-code").value });
  if (r.data.ok) {
    msg($("tfa-msg"), t("acc.2fa_enabled"), true); await load();
    if (new URLSearchParams(location.search).get("setup2fa")) setTimeout(() => location.href = "/", 1200);
  } else msg($("tfa-msg"), r.data.error || t("common.error"));
};
$("tfa-disable").onclick = async () => {
  const r = await api("/api/account/2fa-disable", "POST", { password: $("tfa-pass").value });
  if (r.data.ok) { msg($("tfa-msg"), t("acc.2fa_disabled"), true); $("tfa-pass").value = ""; load(); }
  else msg($("tfa-msg"), r.data.error || t("common.error"));
};
$("p-save").onclick = async () => {
  if ($("p-new").value !== $("p-new2").value) return msg($("p-msg"), t("acc.pwd_mismatch"));
  const r = await api("/api/account/password", "POST", { old: $("p-old").value, new: $("p-new").value });
  if (r.data.ok) { msg($("p-msg"), t("acc.pwd_done"), true); setTimeout(() => location.href = "/login", 1200); }
  else msg($("p-msg"), r.data.error || t("common.error"));
};
let MEM = null;
function renderMem() {
  if (!MEM) return;
  show("mem-box", MEM.enabled || MEM.facts.length);
  const { el } = HUSKY;
  if (!MEM.facts.length) { $("mem-list").replaceChildren(el("tr", null, null)); $("mem-list").firstChild.append(el("td", t("mem.none"), "empty")); $("mem-clear").hidden = true; return; }
  $("mem-clear").hidden = false;
  $("mem-list").replaceChildren(...MEM.facts.map((f) => {
    const tr = el("tr"); const act = el("td", null, "actions"); const b = el("button", t("common.delete"), "btn sm danger");
    b.onclick = async () => { MEM = (await api("/api/memory", "DELETE", { id: f.id })).data; renderMem(); };
    act.append(b); tr.append(el("td", f.text), el("td", f.time, "muted"), act); return tr;
  }));
}
$("mem-clear").onclick = async () => { if (confirm(t("mem.confirm"))) { MEM = (await api("/api/memory", "DELETE", {})).data; renderMem(); msg($("mem-msg"), t("common.done"), true); } };
async function loadMem() { const r = await api("/api/memory"); if (r.ok) { MEM = r.data; renderMem(); } }
document.addEventListener("husky:lang", () => { renderWho(); renderMem(); });
load().then(loadMem);
</script>
</body>
</html>
