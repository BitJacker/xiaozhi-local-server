<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="login.title">Accedi a Husky</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2228%22 fill=%22%231f3fb8%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2256%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22700%22%3EH%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/ui.css">
<script src="/static/strings.js"></script>
<script src="/static/ui.js"></script>
<style>
  .auth { min-height:calc(100dvh - 58px); display:grid; place-items:center; padding:24px 16px; }
  .auth-card { width:100%; max-width:420px; padding:28px 28px 22px; position:relative; }
  /* il margine rosso del quaderno: l'unico segno distintivo della pagina */
  .auth-card::before { content:""; position:absolute; top:0; bottom:0; left:18px; width:2px; background:var(--margin); opacity:.55; }
  .auth-card > * { margin-left:14px; }
  .auth-card h1 { margin-bottom:6px; }
  .auth-card .lead { color:var(--muted); margin-bottom:20px; }
  .auth-card label { margin-top:14px; }
  .auth-card .btn { width:calc(100% - 14px); margin-top:20px; padding:11px; }
  .code-input { font-size:1.5rem; letter-spacing:.35em; text-align:center; }
  .foot { text-align:center; color:var(--muted); font-size:.85rem; margin-top:16px; }
</style>
</head>
<body>
<header id="topbar"></header>
<main class="auth">
  <div>
    <form id="setup" class="sheet auth-card hidden">
      <h1 data-i18n="setup.title">Primo avvio</h1>
      <p class="lead" data-i18n="setup.lead"></p>
      <label for="s-code" data-i18n="setup.code"></label>
      <input id="s-code" class="code-input" inputmode="numeric" autocomplete="off" required>
      <label for="s-user" data-i18n="login.user"></label>
      <input id="s-user" autocomplete="username" required minlength="3" maxlength="32">
      <label for="s-pass" data-i18n="login.pass"></label>
      <input id="s-pass" type="password" autocomplete="new-password" required>
      <label for="s-pass2" data-i18n="setup.pass2"></label>
      <input id="s-pass2" type="password" autocomplete="new-password" required>
      <button class="btn" data-i18n="setup.submit"></button>
      <div class="msg" id="s-msg" role="alert"></div>
    </form>

    <form id="login" class="sheet auth-card hidden">
      <h1 data-i18n="login.title">Accedi a Husky</h1>
      <p class="lead" data-i18n="login.lead"></p>
      <div id="cred">
        <label for="l-user" data-i18n="login.user"></label>
        <input id="l-user" autocomplete="username" required>
        <label for="l-pass" data-i18n="login.pass"></label>
        <input id="l-pass" type="password" autocomplete="current-password" required>
      </div>
      <div id="otp" class="hidden">
        <label for="l-code" data-i18n="login.code"></label>
        <input id="l-code" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
      </div>
      <button class="btn" id="l-btn" data-i18n="login.submit"></button>
      <div class="msg" id="l-msg" role="alert"></div>
    </form>
    <p class="foot" id="ver"></p>
  </div>
</main>
<script>
const { t, api, msg } = HUSKY;
const $ = (id) => document.getElementById(id);
const next = (() => { const n = new URLSearchParams(location.search).get("next") || "/"; return n.startsWith("/") && !n.startsWith("//") ? n : "/"; })();
HUSKY.topbar(null, { noUser: true });

(async () => {
  const st = await (await fetch("/api/auth/state")).json();
  $("ver").textContent = "Husky locale v" + st.version;
  if (!st.auth_enabled || (st.user && !st.needs_setup)) { location.href = next; return; }
  $(st.needs_setup ? "setup" : "login").classList.remove("hidden");
  (st.needs_setup ? $("s-code") : $("l-user")).focus();
})();

$("setup").onsubmit = async (e) => {
  e.preventDefault();
  if ($("s-pass").value !== $("s-pass2").value) return msg($("s-msg"), t("setup.mismatch"));
  const r = await api("/api/setup", "POST", { code: $("s-code").value, username: $("s-user").value, password: $("s-pass").value });
  if (r.data.ok) location.href = "/account?setup2fa=1"; else msg($("s-msg"), r.data.error || t("common.error"));
};

let needCode = false;
$("login").onsubmit = async (e) => {
  e.preventDefault();
  $("l-btn").disabled = true; msg($("l-msg"), "");
  const r = await api("/api/login", "POST", { username: $("l-user").value, password: $("l-pass").value, code: $("l-code").value });
  $("l-btn").disabled = false;
  if (r.data.ok) { location.href = next; return; }
  if (r.data.need_2fa) {
    needCode = true;
    $("cred").classList.add("hidden"); $("otp").classList.remove("hidden"); $("l-code").required = true; $("l-code").focus();
    $("l-btn").textContent = t("login.verify"); return;
  }
  msg($("l-msg"), r.data.error || t("common.error"));
  if ($("l-code").value) { $("l-code").value = ""; $("l-code").focus(); }
};
document.addEventListener("husky:lang", () => { if (needCode) $("l-btn").textContent = t("login.verify"); });
</script>
</body>
</html>
