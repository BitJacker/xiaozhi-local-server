<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accesso Husky</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%232563eb%22/%3E%3C/svg%3E">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d232b; --muted:#667085; --accent:#2563eb; --err:#dc2626; --ok:#16a34a; --line:#8884; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1318; --card:#171c23; --fg:#e6e9ee; --muted:#98a2b3; --accent:#60a5fa; --line:#fff3; } }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); min-height:100dvh; display:grid; place-items:center; padding:16px; }
  .card { background:var(--card); border-radius:14px; padding:24px; width:100%; max-width:380px; box-shadow:0 1px 3px #0002; }
  h1 { font-size:20px; margin:0 0 4px; }
  p { color:var(--muted); font-size:14px; margin:0 0 16px; }
  label { display:block; font-size:14px; margin:12px 0 4px; }
  input { width:100%; font:inherit; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  button { width:100%; font:inherit; border:0; border-radius:10px; padding:12px; margin-top:18px; cursor:pointer; background:var(--accent); color:#fff; }
  button:disabled { opacity:.6; cursor:default; }
  .msg { font-size:14px; margin-top:12px; min-height:20px; color:var(--err); }
  .hidden { display:none; }
  .code { letter-spacing:4px; text-align:center; font-size:20px; }
  .foot { font-size:12px; color:var(--muted); text-align:center; margin-top:16px; }
</style>
</head>
<body>
<main class="card">
  <form id="setup" class="hidden">
    <h1>Configurazione iniziale</h1>
    <p>Crea l'account amministratore. Il codice di configurazione è stampato nel terminale del server.</p>
    <label for="s-code">Codice di configurazione</label>
    <input id="s-code" inputmode="numeric" autocomplete="off" required>
    <label for="s-user">Username</label>
    <input id="s-user" autocomplete="username" required minlength="3" maxlength="32">
    <label for="s-pass">Password</label>
    <input id="s-pass" type="password" autocomplete="new-password" required>
    <label for="s-pass2">Ripeti la password</label>
    <input id="s-pass2" type="password" autocomplete="new-password" required>
    <button>Crea amministratore</button>
    <div class="msg" id="s-msg"></div>
  </form>

  <form id="login" class="hidden">
    <h1>Accedi a Husky</h1>
    <p>Assistente vocale locale: i dati restano su questo server.</p>
    <div id="cred">
      <label for="l-user">Username</label>
      <input id="l-user" autocomplete="username" required>
      <label for="l-pass">Password</label>
      <input id="l-pass" type="password" autocomplete="current-password" required>
    </div>
    <div id="otp" class="hidden">
      <label for="l-code">Codice dell'app di autenticazione (2FA)</label>
      <input id="l-code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
    </div>
    <button id="l-btn">Accedi</button>
    <div class="msg" id="l-msg"></div>
  </form>
  <div class="foot" id="ver"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const next = (() => { const n = new URLSearchParams(location.search).get("next") || "/"; return n.startsWith("/") && !n.startsWith("//") ? n : "/"; })();
async function post(url, data) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "X-Requested-With": "husky" }, body: JSON.stringify(data) });
  return { status: r.status, data: await r.json().catch(() => ({})) };
}

(async () => {
  const st = await (await fetch("/api/auth/state")).json();
  $("ver").textContent = "Husky locale v" + st.version;
  if (!st.auth_enabled || (st.user && !st.needs_setup)) { location.href = next; return; }
  $(st.needs_setup ? "setup" : "login").classList.remove("hidden");
  (st.needs_setup ? $("s-code") : $("l-user")).focus();
})();

$("setup").onsubmit = async (e) => {
  e.preventDefault();
  if ($("s-pass").value !== $("s-pass2").value) { $("s-msg").textContent = "Le password non coincidono"; return; }
  const r = await post("/api/setup", { code: $("s-code").value, username: $("s-user").value, password: $("s-pass").value });
  if (r.data.ok) location.href = "/account?setup2fa=1"; else $("s-msg").textContent = r.data.error || "Errore";
};

$("login").onsubmit = async (e) => {
  e.preventDefault();
  $("l-btn").disabled = true; $("l-msg").textContent = "";
  const r = await post("/api/login", { username: $("l-user").value, password: $("l-pass").value, code: $("l-code").value });
  $("l-btn").disabled = false;
  if (r.data.ok) { location.href = next; return; }
  if (r.data.need_2fa) {
    $("cred").classList.add("hidden"); $("otp").classList.remove("hidden"); $("l-code").required = true; $("l-code").focus();
    $("l-btn").textContent = "Verifica"; return;
  }
  $("l-msg").textContent = r.data.error || "Errore";
  if ($("l-code").value) { $("l-code").value = ""; $("l-code").focus(); }
};
</script>
</body>
</html>
