<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="chat.title">Husky</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2228%22 fill=%22%231f3fb8%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2256%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22700%22%3EH%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/ui.css">
<script src="/static/strings.js"></script>
<script src="/static/ui.js"></script>
<style>
  body { display:flex; flex-direction:column; height:100dvh; }
  .chat { flex:1; min-height:0; width:100%; max-width:820px; margin:0 auto; padding:16px 16px 0; display:flex; flex-direction:column; }
  .chat-head { display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  .chat-head p { margin:0; color:var(--muted); font-size:.95rem; flex:1; min-width:220px; }
  .status { display:inline-flex; align-items:center; gap:8px; font-size:.92rem; padding:4px 12px; border-radius:99px;
    background:var(--sheet); border:1px solid var(--line); white-space:nowrap; }
  .status::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--red); }
  .status[data-state="connected"]::before { background:var(--green); }
  .status[data-state="listening"]::before { background:var(--red); animation:pulse 1.2s infinite; }
  .status[data-state="thinking"]::before { background:var(--amber); }
  .status[data-state="speaking"]::before { background:var(--ink); }
  @keyframes pulse { 50% { opacity:.25; } }

  /* il foglio del quaderno, con il margine rosso */
  #log { flex:1; min-height:0; overflow-y:auto; position:relative; padding:18px 18px 18px 52px; display:flex; flex-direction:column; gap:12px; }
  #log::before { content:""; position:absolute; left:34px; top:0; bottom:0; width:2px; background:var(--margin); opacity:.5; }
  #log .msg { max-width:min(78%, 560px); white-space:pre-wrap; margin:0; line-height:1.5; min-height:0; font-size:1rem; }
  #log .msg.user { align-self:flex-end; color:var(--ink); background:var(--ink-soft); padding:8px 14px; border-radius:14px 14px 4px 14px; }
  #log .msg.bot { align-self:flex-start; padding:2px 0; font-size:1.06rem; }
  #log .msg.sys { align-self:center; color:var(--muted); font-size:.9rem; text-align:center; }
  .hint { color:var(--muted); margin:auto 0; text-align:center; padding:0 12px; }

  .dock { width:100%; max-width:820px; margin:0 auto; padding:14px 16px 18px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px; }
  .dock .left { justify-self:start; }
  .dock form { grid-column:1 / -1; display:flex; gap:8px; }
  .dock form input { flex:1; }
  /* il pulsante per parlare: l'elemento protagonista */
  #talk { width:104px; height:104px; border-radius:50%; border:0; cursor:pointer; touch-action:none; user-select:none;
    -webkit-user-select:none; background:var(--ink); color:var(--sheet); display:grid; place-items:center;
    box-shadow:0 0 0 6px var(--sheet), 0 0 0 8px var(--line); transition:transform .12s, box-shadow .2s; }
  #talk svg { width:40px; height:40px; }
  #talk:active { transform:scale(.96); }
  #talk.active { background:var(--red); box-shadow:0 0 0 6px var(--sheet), 0 0 0 10px var(--red); }
  .talk-label { text-align:center; color:var(--muted); font-size:.9rem; margin-top:10px; min-height:1.3em; }
  .center { display:flex; flex-direction:column; align-items:center; }
  #auto[aria-pressed="true"], #lesson[aria-pressed="true"] { background:var(--red-soft); color:var(--red); border-color:var(--red); }
  .dock .left { display:flex; gap:8px; flex-wrap:wrap; }
  #persona { width:auto; min-width:150px; }
  #log .msg.lesson { align-self:flex-end; color:var(--muted); font-style:italic; }
  @media (max-width:560px) {
    .dock { grid-template-columns:1fr; justify-items:center; }
    .dock .left { justify-self:center; order:2; }
    #log { padding-left:40px; } #log::before { left:24px; }
    #log .msg { max-width:90%; }
  }
</style>
</head>
<body>
<header id="topbar"></header>
<main class="chat">
  <div class="chat-head">
    <p data-i18n="chat.intro"></p>
    <select id="persona" class="hidden" data-i18n-aria="chat.persona"></select>
    <span class="status" id="state" data-state="offline" role="status" aria-live="polite"></span>
  </div>
  <div id="log" class="sheet" aria-live="polite"><p class="hint" id="hint" data-i18n="chat.empty"></p></div>
</main>
<div class="dock">
  <div class="left"><button id="auto" class="btn quiet" type="button" aria-pressed="false" data-i18n="chat.auto"></button>
    <button id="lesson" class="btn quiet hidden" type="button" aria-pressed="false" data-i18n="chat.lesson"></button></div>
  <div class="center">
    <button id="talk" type="button" data-i18n-aria="chat.talk_aria">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
    </button>
    <div class="talk-label" id="talk-label" data-i18n="chat.hold"></div>
  </div>
  <div></div>
  <form id="form"><input id="text" autocomplete="off" data-i18n-placeholder="chat.placeholder"><button class="btn" data-i18n="chat.send"></button></form>
</div>
<script>
const { t } = HUSKY;
const $ = (id) => document.getElementById(id);
const log = (text, cls) => {
  $("hint")?.remove();
  const d = document.createElement("p"); d.className = "msg " + cls; d.textContent = text;
  $("log").append(d); $("log").scrollTop = 1e9; return d;
};
// stato: data-state è fisso (per i test e i colori), il testo cambia con la lingua
const setState = (s) => { $("state").dataset.state = s; $("state").textContent = t("state." + s); };
setState("offline");
document.addEventListener("husky:lang", () => {
  setState($("state").dataset.state);
  $("talk-label").textContent = t(sending && !autoMode ? "chat.listening" : "chat.hold");
  $("auto").textContent = t(autoMode ? "chat.auto_stop" : "chat.auto");
  $("lesson").textContent = t(lessonMode ? "chat.lesson_stop" : "chat.lesson");
  renderPersonas();
});
let lessonMode = false, PERSONAS = null;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
HUSKY.topbar("/").then((me) => { if (me && me.lessons_allowed) $("lesson").classList.remove("hidden"); });
function renderPersonas() {
  if (!PERSONAS || !PERSONAS.items.length) return;
  const sel = $("persona"), cur = sel.value || store.get("husky-persona") || "";
  sel.replaceChildren(el("option", PERSONAS.default), ...PERSONAS.items.map((p) => el("option", p.name)));
  sel.options[0].value = ""; PERSONAS.items.forEach((p, i) => { sel.options[i + 1].value = p.id; });
  sel.value = PERSONAS.items.some((p) => p.id === cur) ? cur : "";
  sel.classList.remove("hidden");
}
const el = HUSKY.el;
const tq = new URLSearchParams(location.search).get("token");
fetch("/api/personas" + (tq ? `?token=${encodeURIComponent(tq)}` : "")).then((r) => r.ok ? r.json() : null).then((d) => { PERSONAS = d; renderPersonas(); }).catch(() => {});

let ws, ctx, micNode, micStream, playRate = 22050, playTime = 0, sending = false, autoMode = false;
let sources = [], muted = false, preroll = [], tailTimer = null;  // audio in coda; muted = scarta l'audio di una risposta interrotta
function stopPlayback() {
  for (const s of sources) { try { s.stop(); } catch {} }
  sources = []; playTime = 0; muted = true;
}
const token = new URLSearchParams(location.search).get("token") || "";

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/xiaozhi/v1/?device-id=web&token=${encodeURIComponent(token)}`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => ws.send(JSON.stringify({ type: "hello", version: 1, transport: "websocket",
    audio_params: { format: "pcm", sample_rate: 16000, channels: 1 } }));
  ws.onmessage = (e) => typeof e.data === "string" ? onJson(JSON.parse(e.data)) : play(e.data);
  ws.onclose = async () => {
    setState("reconnecting");
    // sessione scaduta? torna al login
    try { const r = await fetch("/api/me" + (token ? `?token=${encodeURIComponent(token)}` : "")); if (r.status === 401) { location.href = "/login"; return; } } catch {}
    setTimeout(connect, 2000);
  };
}

function onJson(m) {
  if (m.type === "hello") {
    playRate = m.audio_params?.sample_rate || playRate; setState("connected");
    const p = store.get("husky-persona"); if (p) ws.send(JSON.stringify({ type: "persona", id: p }));
  }
  else if (m.type === "persona") { if (m.id !== (store.get("husky-persona") || "")) log(t("chat.persona_now", { n: m.name }), "sys"); store.set("husky-persona", m.id); }
  else if (m.type === "lesson") onLesson(m);
  else if (m.type === "stt") log(m.text, "user");
  else if (m.type === "tts" && m.state === "sentence_start") log(m.text, "bot");
  else if (m.type === "tts" && m.state === "start") { muted = false; setState("speaking"); }
  else if (m.type === "tts" && m.state === "stop") setState(autoMode ? "listening" : "connected");
  else if (m.type === "llm" && m.emotion === "thinking") setState("thinking");
  else if (m.type === "alert") log("📣 " + m.message, "sys");
}

function ensurePlayback() {
  // A 16 kHz il browser ricampiona il microfono con filtro anti-aliasing (qualità migliore per Whisper).
  if (!ctx) { try { ctx = new AudioContext({ sampleRate: 16000 }); } catch { ctx = new AudioContext(); } }
  if (ctx.state === "suspended") ctx.resume();
}

let micReady = null;  // una sola richiesta del microfono anche se si preme due volte
function ensureAudio() {
  ensurePlayback();
  if (!micReady) micReady = setupMic().catch((err) => { micReady = null; throw err; });
  return micReady;
}

async function setupMic() {
  const q = new URLSearchParams(location.search), flag = (k, d) => q.has(k) ? q.get(k) === "1" : d;
  micStream = await navigator.mediaDevices.getUserMedia({ audio: {
    echoCancellation: flag("ec", true), noiseSuppression: flag("ns", false), autoGainControl: flag("agc", true), channelCount: 1 } });
  // Worklet: converte il microfono in PCM 16 kHz int16 e lo invia al server.
  const code = `class Mic extends AudioWorkletProcessor {
    constructor(){ super(); this.ratio = sampleRate/16000; this.acc = []; this.pos = 0; }
    process(inp){ const ch = inp[0][0]; if(!ch) return true;
      for(; this.pos < ch.length; this.pos += this.ratio){ const s = Math.max(-1, Math.min(1, ch[Math.floor(this.pos)])); this.acc.push(s*32767); }
      this.pos -= ch.length;
      if(this.acc.length >= 960){ this.port.postMessage(Int16Array.from(this.acc).buffer); this.acc = []; }
      return true; } }
    registerProcessor("mic", Mic);`;
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([code], { type: "text/javascript" })));
  micNode = new AudioWorkletNode(ctx, "mic");
  micNode.port.onmessage = (e) => {
    if (sending && ws.readyState === 1) ws.send(e.data);
    else { preroll.push(e.data); if (preroll.length > 5) preroll.shift(); }  // ultimi ~300 ms
  };
  ctx.createMediaStreamSource(micStream).connect(micNode);
}

function play(buf) {
  if (!ctx || muted) return;
  const pcm = new Int16Array(buf), f = new Float32Array(pcm.length);
  for (let i = 0; i < pcm.length; i++) f[i] = pcm[i] / 32768;
  const ab = ctx.createBuffer(1, f.length, playRate); ab.copyToChannel(f, 0);
  const src = ctx.createBufferSource(); src.buffer = ab; src.connect(ctx.destination);
  playTime = Math.max(playTime, ctx.currentTime + 0.05); src.start(playTime); playTime += ab.duration;
  sources.push(src); src.onended = () => { sources = sources.filter((x) => x !== src); };
}

const listen = (state, mode) => ws.send(JSON.stringify({ type: "listen", state, mode }));

function setLesson(on) {
  lessonMode = on; sending = on || autoMode;
  $("lesson").setAttribute("aria-pressed", String(on));
  $("lesson").textContent = t(on ? "chat.lesson_stop" : "chat.lesson");
  $("auto").disabled = on; $("talk").disabled = on;
  setState(on ? "listening" : "connected");
}
function onLesson(m) {
  if (m.state === "started") { setLesson(true); log(t("chat.lesson_on", { n: m.title }), "sys"); }
  else if (m.state === "text") log(m.text, "lesson");
  else if (m.state === "summarizing") { if (lessonMode) { setLesson(false); listen("stop", "auto"); } log(t("chat.lesson_summarizing"), "sys"); setState("thinking"); }
  else if (m.state === "done") {
    const d = log(m.summary, "bot");
    const a = el("a", t("chat.lesson_open"), null, { href: "/lezioni?id=" + encodeURIComponent(m.id) });
    d.append(document.createElement("br"), a); setState("connected");
  } else if (m.state === "denied") { setLesson(false); log(t("chat.lesson_denied"), "sys"); }
}
$("lesson").onclick = async () => {
  if (!lessonMode) {
    try { await ensureAudio(); } catch (err) { log(t("chat.mic_error", { err: err.message }), "sys"); return; }
    if (autoMode) $("auto").click();
    stopPlayback(); ws.send(JSON.stringify({ type: "abort" }));
    ws.send(JSON.stringify({ type: "lesson", state: "start" }));
    listen("start", "auto"); sending = true;
  } else {
    sending = false; listen("stop", "auto");
    ws.send(JSON.stringify({ type: "lesson", state: "stop" }));
  }
};
$("persona").onchange = () => { ws.send(JSON.stringify({ type: "persona", id: $("persona").value })); };

async function startTalk(e) {
  e.preventDefault();
  if (autoMode) return;
  try { await ensureAudio(); } catch (err) { log(t("chat.mic_error", { err: err.message }), "sys"); return; }
  stopPlayback();
  if (tailTimer) { clearTimeout(tailTimer); tailTimer = null; listen("stop", "manual"); }
  ws.send(JSON.stringify({ type: "abort" }));
  listen("start", "manual"); sending = true;
  // invia anche i 300 ms prima della pressione: non si perde l'inizio della prima parola
  for (const b of preroll) ws.send(b);
  preroll = [];
  $("talk").classList.add("active"); $("talk-label").textContent = t("chat.listening");
}
function stopTalk() {
  if (!sending || autoMode || tailTimer) return;
  $("talk").classList.remove("active"); $("talk-label").textContent = t("chat.hold");
  // continua a registrare per mezzo secondo: spesso si rilascia mentre si finisce l'ultima parola
  tailTimer = setTimeout(() => { tailTimer = null; sending = false; listen("stop", "manual"); }, 500);
}
$("talk").addEventListener("pointerdown", startTalk);
$("talk").addEventListener("pointerup", stopTalk);
$("talk").addEventListener("pointerleave", stopTalk);
// da tastiera: spazio o invio tenuti premuti sul pulsante
$("talk").addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) startTalk(e); });
$("talk").addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") stopTalk(); });

$("auto").onclick = async () => {
  try { await ensureAudio(); } catch (err) { log(t("chat.mic_error", { err: err.message }), "sys"); return; }
  autoMode = !autoMode; sending = autoMode;
  $("auto").setAttribute("aria-pressed", String(autoMode));
  $("auto").textContent = t(autoMode ? "chat.auto_stop" : "chat.auto");
  if (autoMode) { listen("start", "auto"); setState("listening"); } else { listen("stop", "auto"); setState("connected"); }
};

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const v = $("text").value.trim(); if (!v) return;
  // per scrivere serve solo l'audio in uscita: niente permesso del microfono (prima la domanda aspettava la sua risposta)
  ensurePlayback();
  $("text").value = "";
  ws.send(JSON.stringify({ type: "text", text: v }));
};

if (!window.isSecureContext) log(t("chat.insecure"), "sys");
connect();
</script>
</body>
</html>
