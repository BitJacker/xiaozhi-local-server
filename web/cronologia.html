<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="hist.title">Cronologia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2228%22 fill=%22%231f3fb8%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2256%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22700%22%3EH%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/ui.css">
<script src="/static/strings.js"></script>
<script src="/static/ui.js"></script>
<style>
  .wrap { max-width:860px; }
  .head { display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  .head > div:first-child { flex:1; min-width:240px; }
  .head h1 { margin-bottom:4px; }
  .tools { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
  .tools select { width:auto; min-width:170px; }
  .conv { padding:16px 20px 16px 52px; position:relative; }
  .conv + .conv { margin-top:14px; }
  .conv::before { content:""; position:absolute; left:34px; top:0; bottom:0; width:2px; background:var(--margin); opacity:.45; }
  .conv-meta { color:var(--muted); font-size:.88rem; margin-bottom:10px; display:flex; gap:12px; flex-wrap:wrap; }
  .line { display:grid; grid-template-columns:4.2em 1fr; gap:10px; padding:5px 0; }
  .line time { color:var(--muted); font-size:.85rem; padding-top:.15em; font-variant-numeric:tabular-nums; }
  .line.user p { color:var(--ink); font-weight:700; }
  .line p { margin:0; white-space:pre-wrap; }
</style>
</head>
<body>
<header id="topbar"></header>
<main class="page wrap">
  <div class="head">
    <div>
      <h1 data-i18n="hist.title"></h1>
      <p class="muted" style="margin:0" data-i18n="hist.lead"></p>
    </div>
    <div class="tools">
      <div><label for="day" data-i18n="hist.day"></label><select id="day"></select></div>
      <button class="btn quiet" id="reload" data-i18n="hist.reload"></button>
      <button class="btn danger" id="del" data-i18n="hist.delete"></button>
    </div>
  </div>
  <div id="list"></div>
</main>
<script>
const { t, el } = HUSKY;
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get("token") || "";
const q = (extra = "") => `/api/history?token=${encodeURIComponent(token)}${extra}`;
HUSKY.topbar("/cronologia");
let lastDay = null;

async function loadDays() {
  const r = await fetch(q());
  if (r.status === 401) { location.href = "/login?next=/cronologia"; return; }
  const d = await r.json();
  $("del").hidden = d.admin === false;
  if (!d.enabled) { $("list").replaceChildren(el("p", t("hist.disabled"), "empty")); return; }
  const sel = $("day"), prev = sel.value;
  sel.replaceChildren(...d.days.map((x) => { const o = el("option", x); o.value = x; return o; }));
  if (!d.days.length) { $("list").replaceChildren(el("p", t("hist.none"), "empty")); return; }
  sel.value = d.days.includes(prev) ? prev : d.days[0];
  await loadDay();
}

async function loadDay() {
  const day = $("day").value; if (!day) return;
  lastDay = (await (await fetch(q(`&day=${day}`))).json()).messages;
  render();
}
function render() {
  if (!lastDay) return;
  const sessions = new Map();
  for (const m of lastDay) { if (!sessions.has(m.session)) sessions.set(m.session, []); sessions.get(m.session).push(m); }
  $("list").replaceChildren(...[...sessions.values()].reverse().map((msgs) => {
    const box = el("article", null, "sheet conv");
    const meta = el("div", null, "conv-meta");
    meta.append(el("span", msgs[0].ts.slice(11, 16)));
    if (msgs[0].user && msgs[0].user !== msgs[0].device) meta.append(el("span", t("hist.user", { u: msgs[0].user })));
    meta.append(el("span", t("hist.device", { d: msgs[0].device })), el("span", t("hist.count", { n: msgs.length })));
    box.append(meta);
    for (const m of msgs) {
      const line = el("div", null, "line " + (m.role === "user" ? "user" : "bot"));
      line.append(el("time", m.ts.slice(11, 19)), el("p", m.text));
      line.title = m.role === "user" ? t("hist.you") : t("hist.husky");
      box.append(line);
    }
    return box;
  }));
}

$("day").onchange = loadDay;
$("reload").onclick = loadDays;
$("del").onclick = async () => {
  const day = $("day").value;
  if (!day || !confirm(t("hist.confirm", { day }))) return;
  const r = await fetch(q(`&day=${day}`), { method: "DELETE", headers: { "X-Requested-With": "husky" } });
  if (!r.ok) { alert((await r.json().catch(() => ({}))).error || t("common.error")); return; }
  await loadDays();
};
document.addEventListener("husky:lang", render);
loadDays();
</script>
</body>
</html>
