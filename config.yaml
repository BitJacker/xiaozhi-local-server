# Configurazione del server xiaozhi locale.
# Tutto gira su questo PC/LAN: nessun dato inviato a server esterni.

server:
  host: 0.0.0.0
  port: 8000                # HTTP: dispositivi xiaozhi e browser sul server stesso (localhost)
  # HTTPS per i browser dagli altri PC e dai telefoni (certificato creato automaticamente in data/tls).
  # Password, cookie e voce viaggiano cifrati e il microfono funziona ovunque. 0 = disattivato.
  https_port: 8443
  # Certificato tuo (facoltativo), al posto di quello autofirmato:
  # tls_cert: /percorso/cert.pem
  # tls_key: /percorso/key.pem
  # Indirizzo con cui i dispositivi raggiungono questo PC (IP LAN).
  # "auto" = rilevato automaticamente.
  public_host: auto
  # Token fissi (opzionali) per script o dispositivi configurati a mano, in aggiunta agli account.
  # Esempio: tokens: ["una-parola-segreta"]
  tokens: []
  # Stampare a console le trascrizioni (utile per debug). Le conversazioni vanno nella cronologia, se attiva.
  log_transcripts: true

assistant:
  name: Husky
  system_prompt: |
    Il tuo nome è Husky. Sei un assistente vocale amichevole.
    Rispondi sempre in italiano, con frasi brevi e chiare (massimo 3-4 frasi),
    perché le tue risposte vengono lette ad alta voce. Non usare MAI emoji né markdown.
    Il testo dell'utente arriva da un riconoscimento vocale e può contenere piccoli errori
    di trascrizione: se l'intenzione è comunque chiara (es. "aluminosità" = luminosità),
    procedi senza farlo notare. Chiedi di ripetere solo se la frase è davvero incomprensibile.
    Non dare per scontato il nome dell'utente se non lo dice chiaramente.
  # Quanti scambi ricordare nella conversazione (memoria solo in RAM).
  max_history_turns: 10
  # Oltre questo numero di strumenti il modello vede solo i gruppi (telecamera, dispositivo, sensori, web...)
  # e apre quelli che gli servono: con tanti strumenti insieme i modelli piccoli sbagliano. 0 = sempre tutti.
  tool_groups_threshold: 12
  # Promemoria e note vocali per utente ("ricordami di..."), salvati cifrati sul server.
  notes: true

# Cartella con TUTTI i tuoi dati: impostazioni personali (data/config.yaml), utenti, dispositivi,
# cronologia. Gli aggiornamenti non la toccano mai.
data_dir: data

auth:
  # Accesso con username e password (e 2FA) a client web, cronologia e pagina Admin.
  # Al primo avvio il terminale mostra un codice per creare l'amministratore.
  enabled: true
  require_2fa: false        # true = ogni utente deve attivare la verifica in due passaggi
  min_password_length: 8
  session_days: 7           # dopo quanti giorni bisogna rifare il login
  login_attempts: 5         # tentativi sbagliati prima del blocco...
  lockout_minutes: 15       # ...e per quanti minuti
  # Primo avvio: viene creato l'utente admin con password Passw0rd!, da cambiare OBBLIGATORIAMENTE al primo
  # accesso (prima non si può fare nient'altro). false = l'admin si crea con il codice stampato nel terminale.
  default_admin: true
  max_pending_devices: 20   # dispositivi xiaozhi in attesa di approvazione
  pending_device_minutes: 10  # una richiesta di attivazione scade se non viene approvata
  max_pending_per_ip: 3       # evita che un solo indirizzo occupi tutti gli slot di attivazione

limits:
  # Protezione contro bot e spam
  requests_per_minute: 240  # richieste HTTP per indirizzo IP
  turns_per_minute: 12      # domande all'assistente per utente
  ws_per_ip: 6              # connessioni contemporanee per indirizzo IP

update:
  # Da dove arrivano gli aggiornamenti (pagina Admin, oppure update.sh / update.ps1).
  # NIENTE viene installato in automatico: la pagina Admin mostra le novità e il pulsante "Aggiorna".
  repo: BitJacker/xiaozhi-local-server
  # Aprendo la pagina Admin controlla se c'è una versione nuova (contatta solo GitHub, non invia dati).
  # false = controlla solo quando premi "Controlla aggiornamenti".
  check_on_admin_open: true

history:
  # Salva le conversazioni sul disco di QUESTO server (data/history), per rileggerle dalla pagina
  # /cronologia. Non vengono mai inviate a Internet. false = nessun salvataggio.
  enabled: true
  # Giorni da conservare: le conversazioni più vecchie vengono cancellate (controllo ogni ora). 0 = per sempre
  keep_days: 30

security:
  # Cronologia e segreti 2FA salvati cifrati (AES-256-GCM). La chiave è in data/encryption.key:
  # per proteggerti anche dal furto del disco usa la cifratura del disco (BitLocker / LUKS) oppure
  # tieni la chiave altrove con key_file.
  encrypt_data: true
  # key_file: /percorso/sicuro/husky.key

privacy:
  # Il modello linguistico (llm.base_url) e i server MCP devono essere su questo computer o in rete locale:
  # altrimenti il server NON parte, così nessun dato esce per errore. true = permetti indirizzi esterni.
  allow_external: false

tool_permissions:
  # Quali strumenti MCP (es. della HuskyLens) può usare ciascun ruolo. * = qualunque carattere.
  # Gli utenti normali possono leggere (risultati, elenchi, foto) ma non cambiare modalità,
  # far imparare o dimenticare oggetti, cambiare impostazioni: quello lo fanno admin e dispositivi.
  admin: ["*"]
  device: ["*"]
  user: ["get_*", "*_get_*", "*.get_*", "list_*", "*_list_*", "*.list_*", "view_*", "*_view_*", "read_*",
         "*_read_*", "query_*", "*_query_*", "*status*", "*_result*", "*_info*", "*photo*", "*screenshot*",
         "take_*", "*_take_*", "*.take_*"]

# Risposte immediate a domande frequenti: si scrivono nella pagina Admin. Più alto = la domanda deve essere
# più simile a quella scritta (0-1).
faq:
  min_similarity: 0.82

# MQTT: broker integrato per sensori e attuatori (ESP8266, ESP32, ESPHome, gateway LoRaWAN) e per i dispositivi
# xiaozhi che usano MQTT+UDP. Si accende dalla pagina Admin (sezione MQTT), dove si creano anche gli account.
mqtt:
  port: 1883            # porta del broker (senza TLS: rete locale; l'audio xiaozhi viaggia comunque cifrato AES)
  udp_port: 8884        # porta UDP per la voce dei dispositivi xiaozhi MQTT+UDP
  max_clients: 200
  messages_per_second: 50   # per ogni dispositivo: oltre, i messaggi vengono scartati
  discovery_prefix: homeassistant   # argomenti con cui ESPHome annuncia sensori e comandi
  esphome_command_roles: ["admin", "device"]   # chi può comandare i dispositivi ESPHome (leggere: tutti)

# ESPHome con l'API nativa (senza MQTT): dispositivi trovati in rete e approvati dalla pagina Admin (sezione ESPHome),
# anche schede vocali (voice_assistant) come microfono e altoparlante di Husky.
esphome:
  command_roles: ["admin", "device"]   # chi può comandare i dispositivi (leggere: tutti)
  no_speech_seconds: 5   # schede vocali: se dopo la parola di attivazione nessuno parla, si chiude

# Strumenti personalizzati (comandi, siti web, sensori MQTT): si creano e si accendono dalla pagina
# Admin e partono tutti SPENTI. Qui solo i limiti.
custom_tools:
  max_output_chars: 2000   # testo massimo restituito al modello da un comando o da un sito

asr:
  # Modello Whisper: tiny, base, small, medium, large-v3-turbo (più grande = più preciso ma lento)
  # large-v3-turbo su GPU (GTX 1060) impiega ~1 s per frase.
  model: large-v3-turbo
  # Modello usato se la GPU non è disponibile (su CPU i modelli grandi sono lenti)
  cpu_model: small
  language: it
  # Precisione della ricerca (1 = più veloce, 5 = più preciso, ~0,2 s in più su GPU)
  beam_size: 5
  # auto = prova GPU (CUDA), se non disponibile usa CPU
  device: auto
  compute_type: auto
  # Parole che aiutano il riconoscimento (nomi, termini della telecamera)
  prompt: "Husky, HuskyLens, riconoscimento facciale, riconoscimento oggetti, tracciamento, telecamera, luminosità, volume."

vad:
  # Rilevamento fine frase (modalità "auto" dei dispositivi)
  silence_ms: 800        # silenzio necessario per chiudere la frase
  min_speech_ms: 300     # parlato minimo per considerarlo una frase
  energy_threshold: 0.012  # soglia RMS (0-1); alzare se l'ambiente è rumoroso
  max_utterance_s: 20

llm:
  # Qualsiasi server compatibile OpenAI ESEGUITO IN LOCALE.
  # Predefinito: Ollama (installato da install.sh / install.ps1, Linux e Windows).
  base_url: http://127.0.0.1:11434/v1
  api_key: locale
  model: qwen3:4b-instruct-2507-q4_K_M
  # Con Ollama il modello viene scaricato da solo la prima volta se manca.
  auto_pull: true
  # Alternativa LM Studio:  base_url: http://localhost:1234/v1   model: qwen/qwen3-4b-2507
  # Altri modelli Ollama adatti (con supporto ai tool): llama3.2:3b, llama3.1:8b, mistral-nemo
  temperature: 0.6
  max_tokens: 400
  # Modello con visione (opzionale) per "cosa vedi?" con foto dalla camera.
  # Lascia vuoto per disabilitare.
  vision_model: ""

tts:
  # Voce Piper (offline). Scarica altre voci con:
  #   python -m piper.download_voices --download-dir models/piper it_IT-riccardo-x_low
  voice: models/piper/it_IT-paola-medium.onnx
  length_scale: 1.2       # velocità: <1 più veloce, >1 più lento e calmo
  noise_scale: 0.5        # variazione dell'intonazione (più basso = più stabile)
  noise_w_scale: 0.6      # variazione del ritmo delle sillabe (più basso = più regolare)
  sentence_pause_ms: 350  # pausa tra una frase e l'altra

# Server MCP esterni a cui collegarsi (es. HuskyLens 2 in LAN).
# Su HuskyLens 2: Impostazioni -> MCP -> attiva: mostra un URL tipo http://IP-DI-HUSKYLENS:3000/sse
mcp_servers: []
#  - name: huskylens
#    url: http://IP-DI-HUSKYLENS:3000/sse
